# ReXGlue runtime settings, read from <exe dir>/geometry_wars_retro_evolved_2.toml.
# Full (purchased) license for XamContentGetLicenseMask; the SDK default 0 means trial.
license_mask = 1
gpu_plugin = "xenos"

# Launcher and game window, centered on the primary display. Size is in logical pixels
# (scaled by Windows DPI) and is reduced to fit the display. The game sets the guest video mode from the launcher's
# Aspect Ratio, so it does not follow the window size.
fullscreen = false
monitor = 1
window_width = 1280
window_height = 720

# Friends leaderboard (docs/online.md). A release for friends sets the server address and invite code here; players
# then pick their online name in the launcher's Online page. Empty means the game stays fully offline.
gw2_online_url = ""
gw2_online_invite = ""
